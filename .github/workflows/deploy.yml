name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build website from compressed source
        run: |
          mkdir -p _site
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          data = lzma.decompress(base64.b64decode(Path('assets/index.html.xz.b64').read_text()))
          assert hashlib.sha256(data).hexdigest() == 'ff84ab515441ea0c129c1558a7bdf4674d6911bf9c3a37434d9b500a1222f626'
          Path('_site/index.html').write_bytes(data)
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
